<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kehadiran Onboarding</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h4 class="text-center text-primary fw-bold mb-4">Cek Kehadiran Onboarding</h4>
            
            <!-- Tanggal Onboarding -->
            <div class="mb-3">
                <label for="tanggalOnboarding" class="form-label fw-semibold">Tanggal Onboarding:</label>
                <input type="date" id="tanggalOnboarding" class="form-control">
            </div>

            <!-- Lokasi Onboarding -->
            <div class="mb-4">
                <label for="lokasiOnboarding" class="form-label fw-semibold">Lokasi Onboarding:</label>
                <select id="lokasiOnboarding" class="form-select">
                    <option value="-- Semua Lokasi Onboarding --" selected>-- Semua Lokasi Onboarding --</option>
                    <option value="Online Onboarding">Online Onboarding</option>
                    <option value="WH Bitung">WH Bitung</option>
                    <option value="WH Bogor">WH Bogor</option>
                    <option value="WH Cibinong">WH Cibinong</option>
                    <option value="WH Cibitung">WH Cibitung</option>
                    <option value="WH Pegangsaan">WH Pegangsaan</option>
                    <option value="WH Sentul">WH Sentul</option>
                    <option value="WH Srengseng">WH Srengseng</option>
                </select>
            </div>

            <!-- Tombol Tampilkan Data -->
            <button type="button" id="btnTampilkan" class="btn btn-primary w-100 fw-bold py-2 mb-3" onclick="loadData()">Tampilkan Data</button>

            <!-- Status Memuat -->
            <div id="loadingStatus" class="text-center text-muted fst-italic d-none">
                <small>Memuat data dari sistem...</small>
            </div>
        </div>

        <!-- Area Hasil Data -->
        <div id="hasilContainer" class="mt-4"></div>
    </div>

    <!-- JavaScript untuk interaksi dengan Apps Script -->
    <script>
        // Set default tanggal hari ini saat halaman dimuat
        document.addEventListener("DOMContentLoaded", function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tanggalOnboarding').value = today;
        });

        function loadData() {
            const tanggal = document.getElementById('tanggalOnboarding').value;
            const lokasi = document.getElementById('lokasiOnboarding').value;
            const loadingDiv = document.getElementById('loadingStatus');
            const hasilContainer = document.getElementById('hasilContainer');

            loadingDiv.classList.remove('d-none');
            hasilContainer.innerHTML = '';

            google.script.run
                .withSuccessHandler(function(response) {
                    loadingDiv.classList.add('d-none');
                    if (response.success) {
                        tampilkanHasil(response.data);
                    } else {
                        hasilContainer.innerHTML = `<div class="alert alert-danger">${response.message}</div>`;
                    }
                })
                .withFailureHandler(function(error) {
                    loadingDiv.classList.add('d-none');
                    hasilContainer.innerHTML = `<div class="alert alert-danger">Terjadi kesalahan sistem: ${error.message}</div>`;
                })
                .getDataKehadiran(tanggal, lokasi);
        }

        function tampilkanHasil(data) {
            const hasilContainer = document.getElementById('hasilContainer');
            if (data.length === 0) {
                hasilContainer.innerHTML = `<div class="alert alert-warning text-center">Tidak ada data ditemukan untuk kriteria tersebut.</div>`;
                return;
            }

            let html = `<div class="card shadow-sm p-3 bg-white"><h5 class="fw-bold mb-3">Hasil Pencarian (${data.length} Data)</h5><div class="table-responsive"><table class="table table-striped table-bordered"><thead><tr>`;
            
            // Buat header tabel secara dinamis berdasarkan kunci objek data pertama
            const keys = Object.keys(data[0]);
            keys.forEach(key => {
                html += `<th>${key}</th>`;
            });
            html += `</tr></thead><tbody>`;

            // Masukkan baris data
            data.forEach(row => {
                html += `<tr>`;
                keys.forEach(key => {
                    html += `<td>${row[key] !== undefined ? row[key] : ''}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table></div></div>`;
            hasilContainer.innerHTML = html;
        }
    </script>
</body>
</html>
